<svg width="100%" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="50%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>

    <!-- Title Cyan-Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Bar Chart 1 Gradient -->
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Bar Chart 2 Gradient -->
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.2" />
    </linearGradient>

    <!-- Orb 1 Gradient -->
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Orb 2 Gradient -->
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    .footer-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #64748b;
    }

    /* CSS Keyframes for GitHub Camo compatible animations */
    @keyframes barPulse1 {
      0%, 100% { height: 70px; y: 170px; }
      50% { height: 125px; y: 115px; }
    }
    @keyframes barPulse2 {
      0%, 100% { height: 110px; y: 130px; }
      50% { height: 60px; y: 180px; }
    }
    @keyframes barPulse3 {
      0%, 100% { height: 135px; y: 105px; }
      50% { height: 95px; y: 145px; }
    }
    @keyframes lineDash {
      to { stroke-dashoffset: -80; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes orbFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .bar-1 { animation: barPulse1 4s ease-in-out infinite; }
    .bar-2 { animation: barPulse2 4.5s ease-in-out infinite; }
    .bar-3 { animation: barPulse3 3.8s ease-in-out infinite; }
    .trend-line { stroke-dasharray: 6, 6; animation: lineDash 5s linear infinite; }
    .pulse-dot { animation: nodeBlink 2.5s ease-in-out infinite; }
    .ambient-orb { animation: orbFloat 8s ease-in-out infinite; }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Radial Orbs -->
  <g class="ambient-orb">
    <circle cx="180" cy="80" r="150" fill="url(#orbGrad1)" />
    <circle cx="950" cy="180" r="170" fill="url(#orbGrad2)" />
  </g>

  <!-- Technical Matrix Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
    <line x1="1000" y1="0" x2="1000" y2="280" />
  </g>

  <!-- Dynamic Right-Side Analytics Dashboard Visuals -->
  <g transform="translate(680, 0)">
    <!-- Base chart horizontal floor -->
    <line x1="40" y1="240" x2="460" y2="240" stroke="#1e293b" stroke-width="2" />
    <line x1="40" y1="180" x2="460" y2="180" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1" />
    <line x1="40" y1="120" x2="460" y2="120" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1" />

    <!-- Animated Histogram Bars -->
    <rect class="bar-1" x="70" y="170" width="34" height="70" rx="6" fill="url(#barGrad1)" />
    <rect class="bar-2" x="125" y="130" width="34" height="110" rx="6" fill="url(#barGrad2)" />
    <rect class="bar-3" x="180" y="105" width="34" height="135" rx="6" fill="url(#barGrad1)" />
    <rect class="bar-1" x="235" y="160" width="34" height="80" rx="6" fill="url(#barGrad2)" />
    <rect class="bar-2" x="290" y="120" width="34" height="120" rx="6" fill="url(#barGrad1)" />
    <rect class="bar-3" x="345" y="95" width="34" height="145" rx="6" fill="url(#barGrad2)" />
    <rect class="bar-1" x="400" y="145" width="34" height="95" rx="6" fill="url(#barGrad1)" />

    <!-- Connected Dynamic Stream Line -->
    <path class="trend-line" d="M 87 165 C 135 110, 175 140, 252 145 C 310 150, 360 85, 417 125" fill="none" stroke="#00f2fe" stroke-width="3" />

    <!-- Trend Data Indicator Nodes -->
    <circle class="pulse-dot" cx="87" cy="165" r="4.5" fill="#ffffff" stroke="#00f2fe" stroke-width="2.5" />
    <circle class="pulse-dot" cx="197" cy="120" r="4.5" fill="#ffffff" stroke="#00f2fe" stroke-width="2.5" />
    <circle class="pulse-dot" cx="252" cy="145" r="4.5" fill="#ffffff" stroke="#ff0080" stroke-width="2.5" />
    <circle class="pulse-dot" cx="362" cy="100" r="4.5" fill="#ffffff" stroke="#00f2fe" stroke-width="2.5" />
    <circle class="pulse-dot" cx="417" cy="125" r="5" fill="#ffffff" stroke="#00f2fe" stroke-width="3" />
  </g>

  <!-- Foreground Content & Brand Typography -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 32)">
      <rect width="230" height="26" rx="13" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="14" cy="13" r="4" fill="#00f2fe" />
      <text x="26" y="17" class="badge-pill-text">CURATED DIRECTORY 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="102" class="title-text">
      Awesome Cloud <tspan fill="url(#cyanGrad)">BI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="136" class="subtitle-text">
      The definitive index of Cloud Business Intelligence, Modern Data Platforms &amp; Open Analytics
    </text>

    <!-- Category Chips -->
    <g transform="translate(0, 168)">
      <!-- Chip 1 -->
      <g transform="translate(0, 0)">
        <rect width="144" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
        <text x="14" y="21" class="chip-text">Enterprise SaaS</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(154, 0)">
        <rect width="134" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
        <text x="14" y="21" class="chip-text">Open Source</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(298, 0)">
        <rect width="148" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
        <text x="14" y="21" class="chip-text">Semantic Layers</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(456, 0)">
        <rect width="144" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
        <text x="14" y="21" class="chip-text">Real-Time OLAP</text>
      </g>
    </g>

    <!-- Footer Stats Line -->
    <text x="0" y="235" class="footer-text">
      330k+ Community Stars &#x2022; Market Pricing &amp; Tier Limits &#x2022; Market Dynamics
    </text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
</svg>
