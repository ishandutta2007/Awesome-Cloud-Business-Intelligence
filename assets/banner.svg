<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.1); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-25px, 15px) scale(1.08); }
    }
    @keyframes barWave1 {
      0%, 100% { height: 95px; y: 225px; }
      50% { height: 145px; y: 175px; }
    }
    @keyframes barWave2 {
      0%, 100% { height: 130px; y: 190px; }
      50% { height: 80px; y: 240px; }
    }
    @keyframes barWave3 {
      0%, 100% { height: 160px; y: 160px; }
      50% { height: 110px; y: 210px; }
    }
    @keyframes barWave4 {
      0%, 100% { height: 75px; y: 245px; }
      50% { height: 135px; y: 185px; }
    }
    @keyframes nodeBlink {
      0%, 100% { r: 5px; opacity: 1; }
      50% { r: 7.5px; opacity: 0.6; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; transform-origin: center; }
    .data-bar-1 { animation: barWave1 4s ease-in-out infinite; }
    .data-bar-2 { animation: barWave2 4.6s ease-in-out infinite; }
    .data-bar-3 { animation: barWave3 3.8s ease-in-out infinite; }
    .data-bar-4 { animation: barWave4 4.2s ease-in-out infinite; }
    .trend-line { stroke-dasharray: 8, 4; animation: dashStream 6s linear infinite; }
    .pulse-dot { animation: nodeBlink 2.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs -->
  <g opacity="0.32">
    <circle class="orb-1" cx="220" cy="90" r="140" fill="#00f2fe" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="270" r="160" fill="#7928ca" filter="url(#glow)" />
    <circle class="orb-1" cx="880" cy="70" r="110" fill="#ff0080" filter="url(#glow)" />
  </g>

  <!-- Perspective Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
  </g>

  <!-- Graphic Component: Futuristic Data Analytics Chart in Right Background -->
  <g opacity="0.85" transform="translate(680, 20)">
    <!-- Chart baseline -->
    <line x1="60" y1="300" x2="480" y2="300" stroke="#334155" stroke-width="2" />
    
    <!-- Dynamic Animated Chart Bars -->
    <rect class="data-bar-1" x="90" y="225" width="34" height="75" rx="6" fill="url(#barGrad1)" />
    <rect class="data-bar-2" x="145" y="190" width="34" height="110" rx="6" fill="url(#barGrad2)" />
    <rect class="data-bar-3" x="200" y="160" width="34" height="140" rx="6" fill="url(#barGrad1)" />
    <rect class="data-bar-4" x="255" y="245" width="34" height="55" rx="6" fill="url(#barGrad2)" />
    <rect class="data-bar-1" x="310" y="200" width="34" height="100" rx="6" fill="url(#barGrad1)" />
    <rect class="data-bar-3" x="365" y="150" width="34" height="150" rx="6" fill="url(#barGrad2)" />
    <rect class="data-bar-2" x="420" y="180" width="34" height="120" rx="6" fill="url(#barGrad1)" />

    <!-- Flowing Analytics Trend Line -->
    <path class="trend-line" d="M 90 220 Q 155 130, 215 150 T 325 180 T 435 110" fill="none" stroke="#00f2fe" stroke-width="3.5" filter="url(#softGlow)" />
    
    <!-- Connected Data Nodes -->
    <circle class="pulse-dot" cx="90" cy="220" r="5" fill="#ffffff" stroke="#00f2fe" stroke-width="2.5" />
    <circle class="pulse-dot" cx="215" cy="150" r="5" fill="#ffffff" stroke="#00f2fe" stroke-width="2.5" />
    <circle class="pulse-dot" cx="325" cy="180" r="5" fill="#ffffff" stroke="#ff0080" stroke-width="2.5" />
    <circle class="pulse-dot" cx="435" cy="110" r="6" fill="#ffffff" stroke="#00f2fe" stroke-width="3" filter="url(#softGlow)" />
  </g>

  <!-- Foreground Content: Brand Badges, Title, Subtitle, Feature Chips -->
  <g transform="translate(70, 0)">
    <!-- Category Pill / Badge -->
    <g transform="translate(0, 48)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="4.5" fill="#00f2fe" />
      <text x="30" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.8">
      Awesome Cloud <tspan fill="url(#cyanGrad)">BI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="174" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      The definitive directory of Cloud Business Intelligence, Modern Data Platforms &amp; Open-Source Analytics
    </text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 222)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="146" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Enterprise SaaS</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(156, 0)">
        <rect width="136" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Open Source</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(302, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Semantic Layers</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(462, 0)">
        <rect width="144" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Real-Time OLAP</text>
      </g>
    </g>

    <!-- Bottom Metadata Stats Row -->
    <g transform="translate(0, 290)">
      <text x="0" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        330k+ Community Stars &#x2022; Market Pricing &amp; Tier Limits &#x2022; Market Size &amp; Dynamics
      </text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
</svg>
